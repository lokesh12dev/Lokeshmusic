name: Android Release

# Builds a signed, installable APK and publishes it to GitHub Releases.
#
# Release process:
#   1. Bump `version` in pubspec.yaml (e.g. 10.6.0+186).
#   2. Commit and push to master.
#   3. Push a matching tag:  git tag v10.6.0 && git push origin v10.6.0
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   Base64 of the release keystore (android/app/key.jks)
#   KEYSTORE_PASSWORD Store password
#   KEY_ALIAS         Key alias (default: lokeshmusic)
#   KEY_PASSWORD      Key password
#
# Never commit the keystore or its passwords. Back them up securely: losing
# them means you can no longer publish updates for existing installs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v10.6.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a release version from tag '$TAG'."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION)"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add the release signing secrets before publishing a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS:-lokeshmusic}
          keyPassword=${KEY_PASSWORD}
          EOF
          test -s android/app/key.jks

      - name: Build release APK (arm64)
        run: >
          flutter build apk --release --flavor github
          --split-per-abi --target-platform android-arm64

      - name: Build release APK (universal)
        run: flutter build apk --release --flavor github

      - name: Verify APK signing and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-github-release.apk"
          test -s "$APK"
          unzip -tq "$APK" > /dev/null
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "Verified $APK"

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk \
             "dist/LokeshMusic-v${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-github-release.apk \
             "dist/LokeshMusic-v${VERSION}-universal.apk"
          cd dist
          sha256sum ./*.apk | tee SHA256SUMS.txt
          ls -lh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LokeshMusic-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LokeshMusic v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## LokeshMusic v${{ steps.version.outputs.version }}

            Free and open-source music streaming for Android.

            ### Download
            - `LokeshMusic-v${{ steps.version.outputs.version }}-universal.apk` — works on all Android devices (recommended).
            - `LokeshMusic-v${{ steps.version.outputs.version }}-arm64-v8a.apk` — smaller download for modern 64-bit phones.

            ### Install
            1. Download the APK on your Android device.
            2. Open the downloaded file.
            3. Allow installation from this source when Android asks.
            4. Install and open LokeshMusic.

            SHA-256 checksums are published in `SHA256SUMS.txt`.
            This APK is signed with the LokeshMusic release key.
          files: |
            dist/LokeshMusic-v${{ steps.version.outputs.version }}-arm64-v8a.apk
            dist/LokeshMusic-v${{ steps.version.outputs.version }}-universal.apk
            dist/SHA256SUMS.txt
